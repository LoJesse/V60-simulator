<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手沖萃取模擬器（v3.4 簡化版）</title>
    <!-- Charts are rendered locally; no network dependency. -->
    <style>
        body {
            background-color: #121212; color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }
        .dashboard {
            display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; 
            max-width: 1400px; width: 100%; min-height: 720px;
            background: #1e1e1e; padding: 20px; border-radius: 12px;
        }
        .app-header {
            grid-column: 1 / -1; display: flex; align-items: baseline;
            justify-content: space-between; gap: 16px; padding: 2px 4px 8px;
            border-bottom: 1px solid #343434;
        }
        .app-header h1 { margin: 0; font-size: 1.55rem; letter-spacing: 0.02em; }
        .app-header span { color: #969696; font-size: 0.88rem; }
        .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .panel-title { font-size: 1.06rem; color: #f0f0f0; }
        .canvas-container { background: #2a2a2a; border-radius: 8px; position: relative; width: 100%; }
        /* V60 60° cone visual correction:
           use a fixed aspect ratio so horizontal and vertical scaling are predictable. */
        /* 幾何校正：60 × 30 網格必須使用 2:1 畫布，
           才能讓每個 cell 在螢幕上接近正方形。
           如此 tan(30°) 的模擬斜率會直接呈現為真正的 60° 全錐角。 */
        .bed-container {
            height: auto;
            aspect-ratio: 2 / 1;
            min-height: 0;
        }
        .pond-view { height:110px; position:relative; background:#202830; border-radius:8px 8px 0 0; overflow:hidden; }
        .pond-view svg { width:100%; height:100%; display:block; }
        .pond-label { position:absolute; top:8px; left:12px; color:#a9e3ff; font-size:0.85rem; }
        .playback-group { flex:0 0 100%; display:flex; flex-direction:column; gap:10px; }
        .stage-banner { padding:14px 18px; border:1px solid #4db8ff; border-left-width:5px; border-radius:8px; background:#153347; color:#bceaff; font-size:1.3rem; font-weight:700; }
        .playback-group button { align-self:flex-start; }
        .chart-container { height: 280px; flex-shrink: 0; }
        .diagnostic-container { height: 230px; flex-shrink: 0; }
        canvas { width: 100% !important; height: 100% !important; border-radius: 8px; }
        
        .controls {
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center; 
            background: #2a2a2a; padding: 15px; border-radius: 8px; font-size: 0.95em;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
        button {
            background: #007bff; color: white; border: none; padding: 12px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #0056b3; }
        select {
            padding: 6px; border-radius: 4px; background: #333; color: white; border: 1px solid #555; font-size: 1em;
        }
        
        .stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: #242424; padding: 12px; border-radius: 8px;
        }
        .stat-card {
            background: #303030; border-radius: 6px; padding: 11px 12px;
            color: #bdbdbd; font-size: 0.9rem;
        }
        .stat-card strong { display: block; margin-top: 5px; font-size: 1.18rem; }
        .stat-card:last-child { grid-column: 1 / -1; }
        .stat-value { color: #4db8ff; }
        .fast-color { color: #ff9800; }
        .slow-color { color: #4caf50; }
        .water-color { color: #00bcd4; }
        .legend-bar { display: flex; justify-content: space-between; font-size: 0.85em; font-weight: bold; margin-top: 5px; }
        .highlight { color: #ffeb3b; font-weight: bold; }
        .note { font-size: 0.8em; color: #888; margin-top: -4px; }
        .timeline-note {
            display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
            color: #a8a8a8; font-size: 0.82rem; line-height: 1.4;
        }
        * { box-sizing:border-box; }
        .mobile-chart-tabs { display:none; }
        .chart-choice { position:absolute; opacity:0; width:1px; height:1px; }
        @media (max-width: 900px) {
            body { padding: 10px; }
            .dashboard { grid-template-columns: 1fr; padding: 12px; }
            .app-header { grid-column: 1; align-items: flex-start; flex-direction: column; }
        }
        @media (max-width:600px) {
            body { padding:0; padding-bottom:env(safe-area-inset-bottom); }
            .dashboard { padding:14px 12px 24px; gap:16px; border-radius:0; min-height:100dvh; }
            .app-header { display:grid; grid-template-columns:1fr auto; gap:8px; padding:0 0 10px; align-items:center; }
            .app-header h1 { font-size:1.08rem; line-height:1.3; }
            .app-header > span { grid-row:2; grid-column:1/-1; font-size:0.72rem; }
            #languageSelect { grid-column:2; grid-row:1; width:100px; font-size:0.85rem; }
            .panel { gap:7px; }
            .panel-title { font-size:0.95rem; }
            .pond-view { height:72px; margin-bottom:-7px; border-radius:8px 8px 0 0; }
            .pond-label { top:5px; left:8px; font-size:0.75rem; }
            .bed-container { border-radius:0 0 8px 8px; }
            .legend-bar { gap:8px; font-size:0.65rem; line-height:1.35; font-weight:400; }
            .legend-bar > span { flex:1; min-width:0; overflow-wrap:anywhere; }
            .legend-bar > span:last-child { text-align:right; }
            .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; margin-top:4px!important; }
            .control-group { min-width:0; gap:4px; font-size:0.78rem; }
            .playback-group { grid-column:1/-1; gap:7px; }
            .stage-banner { padding:9px 12px; font-size:1.05rem; }
            .playback-group button { width:100%; }
            button,select { min-height:44px; touch-action:manipulation; }
            select { width:100%; min-width:0; font-size:16px; padding:6px; }
            .controls > .note { display:none; }
            .control-group:has(#timeSlider) { grid-column:1/-1; }
            #timeSlider { width:100%; margin:0; height:30px; accent-color:#4db8ff; }
            .timeline-note { font-size:0.7rem; gap:4px 10px; }
            .timeline-note > span:first-child { display:none; }
            .stats { grid-template-columns:repeat(6,minmax(0,1fr)); padding:8px; gap:6px; }
            .stat-card { grid-column:span 2; padding:8px 6px; font-size:0.66rem; overflow-wrap:anywhere; }
            .stat-card:nth-child(4),.stat-card:last-child { grid-column:span 3; }
            .stat-card strong { font-size:1rem; margin-top:4px; }
            .mobile-chart-tabs { display:flex; gap:4px; padding:4px; border-radius:9px; background:#292929; }
            .mobile-chart-tabs label { flex:1; text-align:center; padding:10px 3px; font-size:0.72rem; border-radius:6px; cursor:pointer; }
            #tabOverall:checked ~ .mobile-chart-tabs label[for="tabOverall"],
            #tabPools:checked ~ .mobile-chart-tabs label[for="tabPools"],
            #tabOutlet:checked ~ .mobile-chart-tabs label[for="tabOutlet"] { color:#bceaff; background:#153347; }
            .chart-pane { display:none; }
            #tabOverall:checked ~ .pane-overall,#tabPools:checked ~ .pane-pools,#tabOutlet:checked ~ .pane-outlet { display:block; }
            .chart-choice:focus-visible ~ .mobile-chart-tabs { outline:2px solid #4db8ff; }
            .chart-container,.diagnostic-container { height:250px; margin-top:8px; }
        }
        .pool-summary { display:none; }
        @media (max-width:600px) {
            .dashboard { min-height:100svh; gap:6px; padding:8px 10px; align-content:start; }
            .app-header { gap:3px; padding-bottom:5px; }
            .app-header h1 { font-size:0.9rem; }
            .app-header > span { font-size:0.65rem; }
            #languageSelect { min-height:32px; }
            .panel { gap:4px; }
            .panel > .panel-title { display:none; }
            .pond-view { height:42px; margin-bottom:-4px; }
            .bed-container { width:min(100%,28svh); align-self:center; }
            .pond-view { width:min(100%,28svh); align-self:center; }
            .pond-label { font-size:0.65rem; }
            .legend-bar { font-size:0.6rem; margin-top:0; }
            .controls { gap:5px 8px; padding:7px; }
            .playback-group { display:grid; grid-template-columns:1fr auto; gap:5px; align-items:center; }
            .stage-banner { font-size:0.9rem; padding:7px 9px; }
            .playback-group button { min-height:36px; padding:8px; font-size:0.75rem; }
            .control-group { gap:2px; font-size:0.65rem; }
            select { min-height:34px; font-size:16px; }
            #timeSlider { height:24px; }
            .timeline-note { font-size:0.63rem; }
            #phaseLabel { display:none; }
            .stats { display:none; }
            .pool-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 0; }
            .pool-stat { padding:7px; border-radius:8px; background:#292929; font-size:0.72rem; }
            .pool-stat strong { display:block; font-size:1.2rem; margin-top:3px; }
            .pool-stat:nth-child(1) { color:#ff9800; }.pool-stat:nth-child(2) { color:#4db8ff; }.pool-stat:nth-child(3) { color:#b388ff; }
            .pool-track { height:4px; margin-top:5px; background:#414141; border-radius:3px; overflow:hidden; }
            .pool-track i { display:block; height:100%; width:0; background:currentColor; }
            .pool-summary-caption { grid-column:1/-1; font-size:0.62rem; color:#aaa; }
            .mobile-chart-tabs,.chart-pane.pane-overall,.chart-pane.pane-outlet { display:none!important; }
            .chart-pane.pane-pools { display:block!important; }
            .pane-pools > .panel-title { display:none; }
            .pane-pools .chart-container { height:clamp(100px,18svh,170px); margin-top:0; }
        }
        @media (max-width:600px) and (max-height:740px) {
            .dashboard { padding:5px 8px; gap:3px; }
            .pond-view { height:30px; }
            .bed-container,.pond-view { width:min(100%,26svh); }
            .pool-summary { padding:2px 0; gap:4px; }.pool-stat { padding:5px; }
            .pool-stat strong { font-size:1.05rem; }
            .pane-pools .chart-container { height:100px; }
            .app-header > span { display:none; }
        }
        .bed-visual { display:flex; flex-direction:column; gap:4px; min-width:0; }
        body,button,select { font-family:ui-rounded,"SF Pro Rounded","Avenir Next",-apple-system,"PingFang TC",sans-serif; font-weight:400; }
        .app-header h1,.stage-banner { font-weight:500; }
        @media (max-width:600px) {
            #bedPanel { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:8px 10px; align-items:start; }
            .bed-visual { grid-column:1; grid-row:1/4; align-self:stretch; gap:0; }
            .bed-visual .pond-view { width:100%; height:34px; margin:0; flex-shrink:0; }
            .bed-visual .bed-container { width:100%; aspect-ratio:1.18; align-self:stretch; }
            .bed-visual .legend-bar { display:flex; flex-direction:column; gap:2px; font-size:0.56rem; margin-top:4px; }
            .bed-visual .legend-bar > span { text-align:left; }
            #bedPanel > .controls { display:contents; }
            #bedPanel .playback-group { grid-column:2; grid-row:1; display:flex; flex-direction:column; gap:6px; width:100%; }
            #bedPanel .stage-banner { width:100%; padding:8px; font-size:0.84rem; line-height:1.3; overflow-wrap:normal; }
            #bedPanel .playback-group button { width:100%; min-height:36px; font-weight:500; }
            #bedPanel .control-group:has(#heatmapMode) { grid-column:2; grid-row:2; }
            #bedPanel .control-group:has(#grindPreset) { grid-column:2; grid-row:3; }
            #bedPanel .control-group:has(#timeSlider) { grid-column:1/-1; grid-row:4; padding:6px 10px; background:#272727; border-radius:10px; }
            #bedPanel .control-group { width:100%; font-size:0.75rem; }
            #bedPanel select { font-size:14px; min-height:36px; padding:5px 2px; }
            #bedPanel .pool-summary { grid-column:1/-1; grid-row:5; width:100%; }
            .pool-stat:nth-of-type(2) { color:#ff9800; }
            .pool-stat:nth-of-type(3) { color:#4db8ff; }
            .pool-stat:nth-of-type(4) { color:#b388ff; }
            .pool-stat strong { font-weight:500; }
            .pane-pools .chart-container { height:clamp(180px,29svh,270px); }
            .app-header h1 { font-size:0.95rem; letter-spacing:0; }
        }
        @media (max-width:600px) and (max-height:680px) {
            #bedPanel { gap:5px 8px; }
            .pane-pools .chart-container { height:155px; }
            .bed-visual .pond-view { height:28px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header class="app-header">
        <h1>手沖萃取模擬器（v3.4 簡化版）</h1>
        <span>374 g 注水 · 含悶蒸 · 試驗模型</span>
        <select id="languageSelect" aria-label="Language"><option value="en" selected>English</option><option value="zh-TW">繁體中文</option></select>
    </header>
    <div class="panel" id="bedPanel">
        <b class="panel-title">粉床狀態</b>
        <div class="bed-visual">
        <div class="pond-view">
            <span class="pond-label">粉面積水 <strong id="pondHeightLabel">0.00 cm</strong></span>
            <svg viewBox="0 0 600 110" preserveAspectRatio="none" aria-label="粉面上方積水高度示意">
                <path d="M 80 5 L 127 105 L 473 105 L 520 5" fill="none" stroke="#647782" stroke-width="2"/>
                <path id="pondFill" d="M127 105 L473 105 L473 105 L127 105 Z" fill="#258bc0" fill-opacity="0.65"/>
                <path id="pondSurface" d="M127 105 L473 105" fill="none" stroke="#a3e6ff" stroke-width="2"/>
                <path d="M127 105 L473 105" stroke="#a28e72" stroke-width="3"/>
            </svg>
        </div>
        <div class="canvas-container bed-container">
            <canvas id="bedCanvas"></canvas>
        </div>
        <div class="legend-bar">
            <span id="legendLow" style="color:#f44336;">■ 紅色 (0% 殘留 / 完全耗盡)</span>
            <span id="legendHigh" style="color:#4caf50;">■ 綠色 (100% 殘留 / 未萃取)</span>
        </div>
        </div>
        
        <div class="controls" style="margin-top: 10px;">
            <div class="playback-group">
                <div id="stageBanner" class="stage-banner" role="status">悶蒸</div>
                <button id="playBtn">播放 / 暫停</button>
            </div>
            <div class="control-group">
                <label>顯示：</label>
                <select id="heatmapMode"><option value="total" selected>總萃取狀態</option><option value="pool0">快池</option><option value="pool1">中池</option><option value="pool2">慢池</option><option value="small">細粉</option><option value="main">粗粉</option><option value="transport">內部水流</option><option value="liquid">液相濃度</option><option value="contact">受擾影響</option></select>
            </div>
            <p class="note">注水：77 → 123 → 174 g，140 s 注完。</p>
            <div class="control-group">
                <label>研磨度：</label>
                <select id="grindPreset">
                    <option value="blue">細</option>
                    <option value="yellow" selected>中</option>
                    <option value="coarse">粗</option>
                </select>
                
            </div>
            <div class="control-group">
                <label>沖煮時間：<span id="timeLabel">0.0</span> s</label>
                <input type="range" id="timeSlider" min="0" max="300" value="0" step="0.5">
                <div class="timeline-note">
                    <span>0–42 s：簡化悶蒸</span>
                    <span id="phaseLabel" class="highlight">0 s 開始簡化悶蒸</span>
                    <span id="finishTimeLabel">滴濾完成：—</span>
                </div>
            </div>
        </div>
        
        <div class="pool-summary">
            <div class="pool-summary-caption">各池已釋出比例（非風味比例）</div>
            <div class="pool-stat"><span>快池</span><strong id="fastRelease">0.0%</strong><div class="pool-track"><i id="fastBar"></i></div></div>
            <div class="pool-stat"><span>中池</span><strong id="midRelease">0.0%</strong><div class="pool-track"><i id="midBar"></i></div></div>
            <div class="pool-stat"><span>慢池</span><strong id="slowRelease">0.0%</strong><div class="pool-track"><i id="slowBar"></i></div></div>
        </div>
        <div class="stats">
            <div class="stat-card">頂部積水<strong class="stat-value water-color"><span id="waterLevelLabel">0.00</span> cm</strong></div>
            <div class="stat-card">細粉完成度<strong class="stat-value fast-color"><span id="smallEyLabel">0.00</span> %</strong></div>
            <div class="stat-card"><span id="mainEyCaption">粗粉完成度</span><strong class="stat-value slow-color"><span id="mainEyLabel">0.00</span> %</strong></div>
            <div class="stat-card">總萃取率<strong class="stat-value"><span id="eyLabel">0.00</span> %</strong></div>
            <div class="stat-card">TDS<strong class="stat-value"><span id="tdsLabel">0.00</span> %</strong></div>
        </div>
    </div>

    <div class="panel">
        <input class="chart-choice" type="radio" name="mobileChart" id="tabOverall" checked>
        <input class="chart-choice" type="radio" name="mobileChart" id="tabPools">
        <input class="chart-choice" type="radio" name="mobileChart" id="tabOutlet">
        <nav class="mobile-chart-tabs" aria-label="Charts">
            <label for="tabOverall">萃取進度</label><label for="tabPools">三池萃取進度</label><label for="tabOutlet">出口變化</label>
        </nav>
        <section class="chart-pane pane-overall">
        <b class="panel-title">萃取進度</b>
        <div class="canvas-container chart-container">
            <canvas id="chartCanvas"></canvas>
        </div>
        </section><section class="chart-pane pane-pools">
        <b class="panel-title" style="margin-top: 6px;">三池萃取進度</b>
        <div class="canvas-container chart-container"><canvas id="poolCanvas"></canvas></div>
        </section><section class="chart-pane pane-outlet">
        <b class="panel-title" style="margin-top: 6px;">出口變化</b>
        <div class="canvas-container diagnostic-container">
            <canvas id="diagnosticCanvas"></canvas>
        </div>
        </section>
    </div>

</div>

<script>
    // Standalone canvas charts. Retains the model's existing chart data interface.
    class Chart {
        constructor(ctx,config){this.ctx=ctx;this.canvas=ctx.canvas;this.data=config.data;this.options=config.options;this.observer=new ResizeObserver(()=>this.update());this.observer.observe(this.canvas.parentElement);}
        destroy(){this.observer.disconnect();}
        update(){
            const c=this.canvas,box=c.parentElement.getBoundingClientRect();if(box.width<1||box.height<1)return;
            const w=box.width,h=box.height,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
            const g=this.ctx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
            const left=36,right=36,top=30,bottom=27,pw=w-left-right,ph=h-top-bottom;if(pw<=0||ph<=0)return;
            const scales=this.options.scales||{},sets=this.data.datasets,n=this.data.labels.length;
            const bounds={};for(const ds of sets){const key=ds.yAxisID||'y',axis=scales[key]||{};bounds[key]={min:axis.min||0,max:axis.max||Math.max(1,...sets.filter(s=>(s.yAxisID||'y')===key).flatMap(s=>s.data))*1.1};}
            g.font='10px -apple-system, sans-serif';g.textBaseline='middle';
            for(let j=0;j<=4;j++){const y=top+ph*j/4;g.strokeStyle='#383838';g.beginPath();g.moveTo(left,y);g.lineTo(w-right,y);g.stroke();let a=Object.values(bounds)[0]||{min:0,max:100};g.fillStyle='#a9a9a9';g.textAlign='right';g.fillText((a.max-(a.max-a.min)*j/4).toFixed(a.max<=10?1:0),left-5,y);}
            const keys=Object.keys(bounds);if(keys.length>1){g.textAlign='left';let a=bounds[keys[1]];for(let j=0;j<=4;j++)g.fillText((a.max-(a.max-a.min)*j/4).toFixed(1),w-right+5,top+ph*j/4);}
            sets.forEach((ds,k)=>{const a=bounds[ds.yAxisID||'y'];g.strokeStyle=ds.borderColor;g.lineWidth=ds.borderWidth||2;g.setLineDash(ds.borderDash||[]);g.beginPath();ds.data.forEach((v,i)=>{const x=left+(n>1?i/(n-1):0)*pw,y=top+ph*(1-(v-a.min)/(a.max-a.min));if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});g.stroke();g.setLineDash([]);g.fillStyle=ds.borderColor;g.textAlign='left';g.font='10px -apple-system, sans-serif';g.fillText(ds.label,5+k*(w/sets.length),12,w/sets.length-8);});
            g.fillStyle='#aaa';g.textAlign='center';for(let j=0;j<=4;j++){const i=Math.round((n-1)*j/4);if(i>=0)g.fillText(this.data.labels[i],left+pw*j/4,h-17);}
            g.textAlign='right';g.fillText('s',w-8,h-17);
        }
    }
    let uiLanguage='en';
    const EN_TEXT={
        '各池已釋出比例（非風味比例）':'Released from each pool · not flavor proportions',
        '手沖萃取模擬器（v3.4 簡化版）':'Pour-over Extraction Simulator (v3.4)',
        '374 g 注水 · 含悶蒸 · 試驗模型':'374 g water · Bloom included · Experimental model',
        '粉面上方積水高度示意':'Ponding height above the coffee bed',
        '粉床狀態':'Coffee bed', '粉面積水':'Ponding height',
        '播放 / 暫停':'Play / Pause','顯示：':'View:',
        '總萃取狀態':'Overall extraction','快池':'Fast pool','中池':'Medium pool','慢池':'Slow pool',

    // 將相鄰兩列的水流以累積流量座標配對。每一來源格的全部流量
    // 都會被送到下一列的一個或數個目的格；碰到錐壁或底部則流出粉床。
    // 這比只把溶質留在同一 x 更能保持每個目的格的進、出水量一致。
    function buildVerticalFlowLinks(qGrid) {
        const links = Array.from({length: ROWS},()=>Array.from({length: COLS},()=>[]));
        for(let y=0;y<ROWS;y++) {
            const sources=[];
            for(let x=0;x<COLS;x++) if(qGrid[y][x]>0) sources.push({x,total:qGrid[y][x],remaining:qGrid[y][x]});
            const next=y+1<ROWS?qGrid[y+1]:new Float64Array(COLS);
            let exit=Math.max(0,sources.reduce((a,b)=>a+b.total,0)-next.reduce((a,b)=>a+b,0));
            // Remove the prescribed Darcy side discharge at the outer cells first.
            const outer=[...sources].sort((a,b)=>Math.abs(b.x-(COLS-1)/2)-Math.abs(a.x-(COLS-1)/2));
            for(const source of outer){const q=Math.min(exit,source.remaining);if(q>0)links[y][source.x].push({destination:-1,fraction:q/source.total});source.remaining-=q;exit-=q;}
            let k=0;
            for(let x=0;x<COLS;x++) {
                let demand=next[x];
                while(demand>1e-14 && k<sources.length){const source=sources[k];const q=Math.min(demand,source.remaining);if(q>0)links[y][source.x].push({destination:idx(x,y+1),fraction:q/source.total});demand-=q;source.remaining-=q;if(source.remaining<1e-14)k++;}
            }
        }
        return links;
    }

    // 以舊 map 計算全部流出，再一次提交新 map。若 Co 太大，自動切分子步；
    // 因此一個子步內溶質至多跨過一列，不會由上到下原地連鎖更新。
    function advectLiquidSolute(liquidGrids, qGrid, flowLinks, duration) {
        const cupByClass = liquidGrids.map(() => 0);
        if (duration <= 0) {
            return {
                grids: liquidGrids,
                cupByClass,
                substeps: 0,
                maxCourant: 0
            };
        }

        let maxCourant = 0;
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                maxCourant = Math.max(
                    maxCourant,
                    qGrid[y][x] * duration / Math.max(liquidWaterMassPerCell*cellVolumeWeights[idx(x,y)], 1e-12)
                );
            }
        }
        const substeps = Math.max(
            1,
            Math.ceil(maxCourant / MAX_ADVECTION_COURANT)
        );
        const subDt = duration / substeps;
        let current = liquidGrids;

        for (let substep = 0; substep < substeps; substep++) {
            const next = current.map(grid => grid.slice());
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = idx(x, y);
                    if (!VALID_MASK[i] || qGrid[y][x] <= 0) continue;
                    const outFraction = Math.min(
                        MAX_ADVECTION_COURANT,
                        qGrid[y][x] * subDt / Math.max(liquidWaterMassPerCell*cellVolumeWeights[i], 1e-12)
                    );
                    const localLinks = flowLinks[y][x];
                    if (!localLinks.length || outFraction <= 0) continue;

                    for (let classIndex = 0; classIndex < current.length; classIndex++) {
                        const outMass = current[classIndex][i] * outFraction;
                        next[classIndex][i] -= outMass;
                        for (const link of localLinks) {
                            const movedMass = outMass * link.fraction;
                            if (link.destination < 0) {
                                cupByClass[classIndex] += movedMass;
                            } else {
                                next[classIndex][link.destination] += movedMass;
                            }
                        }
                    }
                }
            }
            current = next;
        }

        return { grids: current, cupByClass, substeps, maxCourant };
    }

    // Synchronous conservative face flux; substeps enforce positivity and a maximum principle.
    function disperseLiquidSolute(liquidGrids,duration=DT){
        const n=Math.max(1,Math.ceil(duration*dispersionMaxRate/0.8)),dt=duration/n;
        let current=liquidGrids;
        for(let step=0;step<n;step++){
            current=current.map(grid=>{
                const next=grid.slice();
                for(const f of dispersionFaces){
                    const dm=dt*f.G*(grid[f.a]/f.Va-grid[f.b]/f.Vb);
                    next[f.a]-=dm;next[f.b]+=dm;
                }
                return next;
            });
        }
        return current;
    }

    // 固定顆粒表面濃度下，均勻初始濃度球體的平均剩餘比例。
    // theta(Fo) = 6/pi^2 sum[n=1..inf] exp(-n^2 pi^2 Fo)/n^2。
    // 它只需要時間（Fourier number），不需要在每個床層 cell 裡再切徑向網格。
    // 對水平投影面積 dA = 2 pi r dr 做中點積分。
    // Gagné 的圓錐推導可寫成一系列不同 r 的垂直 Darcy 流柱；這裡保留積分形式，
    // 方便之後替換為實測的 beta、a_open，或讓貼壁比例隨高度改變。
    function integrateRadialDischarge(rMin, rMax, superficialVelocityAtRadius) {
        if (rMax <= rMin) return 0;
        const dr = (rMax - rMin) / HYDRAULIC_RADIAL_STEPS;
        let discharge = 0;
        for (let step = 0; step < HYDRAULIC_RADIAL_STEPS; step++) {
            const radius = rMin + (step + 0.5) * dr;
            discharge += superficialVelocityAtRadius(radius)
                * 2.0 * Math.PI * radius * dr;
        }
        return discharge;
    }

    function coneVolumeToHeight(height) {
        return Math.PI * CONE_SLOPE * CONE_SLOPE
            * Math.pow(Math.max(0, height), 3) / 3.0;
    }

    function freeWaterVolume(pondingHeight, bedHeight) {
        const totalHeight = bedHeight + Math.max(0, pondingHeight);
        return Math.max(0,
            coneVolumeToHeight(totalHeight) - coneVolumeToHeight(bedHeight));
    }

    function pondingHeightFromVolume(volume, bedHeight) {
        const heightCubed = Math.pow(bedHeight, 3)
            + 3.0 * Math.max(0, volume)
            / (Math.PI * CONE_SLOPE * CONE_SLOPE);
        return Math.max(0, Math.cbrt(heightCubed) - bedHeight);
    }

    // Gagné 圓錐 Darcy 模型的數值積分版。
    // 以 Kh = k g / nu 與 Gf = beta g / nu 改寫原式後：
    // dQ = h(r) dA / [ell(r)/Kh + 1/Gf]。
    // 底孔內是 core；底孔外到粉床頂半徑仍穿過咖啡；再向外才是純濾紙旁通。
    function gagneConeDischarge(pondingHeight, geometry, bedHydraulicConductivity) {
        const bedHeight = geometry.bedHeight;
        const totalWaterHeight = bedHeight + Math.max(0, pondingHeight);
        const bedRadius = bedHeight * CONE_SLOPE;
        const waterRadius = totalWaterHeight * CONE_SLOPE;
        const coreRadius = Math.min(V60_OUTLET_RADIUS_CM, bedRadius);
        const Kh = Math.max(bedHydraulicConductivity, 1e-12);
        const Gf = Math.max(FILTER_HEAD_CONDUCTANCE, 1e-12);

        const coffeeFilterVelocity = radius => {
            const coffeePath = Math.max(0, bedHeight - radius / CONE_SLOPE);
            const localHead = Math.max(0, totalWaterHeight - radius / CONE_SLOPE);
            const areaSpecificResistance = coffeePath / Kh + 1.0 / Gf;
            return localHead / Math.max(areaSpecificResistance, 1e-12);
        };

        const qCore = integrateRadialDischarge(
            0, coreRadius, coffeeFilterVelocity
        );
        const qSideCoffeeMax = integrateRadialDischarge(
            coreRadius, bedRadius, coffeeFilterVelocity
        );
        const qFilterOnlyMax = integrateRadialDischarge(
            bedRadius,
            waterRadius,
            radius => Gf * Math.max(0, totalWaterHeight - radius / CONE_SLOPE)
        );

        const qSideCoffee = A_OPEN * qSideCoffeeMax;
        const qBypass = A_OPEN * qFilterOnlyMax;
        return {
            qBed: qCore + qSideCoffee,
            qBypass,
            qCore,
            qSideCoffee,
            qFilterOnlyMax,
            coffeeFilterVelocity,
            coreRadius,
            totalWaterHeight,
            bedRadius,
            waterRadius
        };
    }

    function getBedGeometry(dose) {
        // 以預浸後 20 g = 5.0 cm 為暫定基準，並假設不同粉量維持相似圓錐。
        // 線性尺度 ∝ dose^(1/3)，因此圓錐體積 ∝ L^3 ∝ dose。
        const volumeScale = dose / BASE_DOSE;
        const linearScale = Math.cbrt(volumeScale);
        const bedHeight = BASE_BED_HEIGHT * linearScale;
        const bedRadius = bedHeight * CONE_SLOPE;
        const flowArea = Math.PI * bedRadius * bedRadius;
        const cellArea = flowArea / COLS;
        const bedConeVolume = coneVolumeToHeight(bedHeight);
        return { bedHeight, bedRadius, flowArea, cellArea, bedConeVolume };
    }


    // Discrete streamfunction on dual plaquettes: sum of closed oriented cycles.
    // Every cycle has exactly zero nodal divergence; no flow crosses the bed boundary.
    // Effective network geometry only: NOT a resolved axisymmetric momentum solution.
    function buildConservativeCirculation(depth,targetFlow,geometry){
        const n=COLS*ROWS, signed=new Map(),vx=new Float64Array(n),vz=new Float64Array(n);
        const posX=new Float64Array(n),posZ=new Float64Array(n),volume=new Float64Array(n);
        for(let y=0;y<ROWS;y++){
            const row=[];for(let x=0;x<COLS;x++)if(VALID_MASK[idx(x,y)])row.push(idx(x,y));
            const radius=geometry.bedRadius*(1-(y+.5)/ROWS);
            row.forEach((i,k)=>{posX[i]=-radius+2*radius*(k+.5)/row.length;posZ[i]=(y+.5)*geometry.bedHeight/ROWS;volume[i]=liquidWaterMassPerCell*cellVolumeWeights[i]/POROSITY;});
        }
        const add=(a,b,q)=>{const lo=Math.min(a,b),hi=Math.max(a,b),key=lo*n+hi;signed.set(key,(signed.get(key)||0)+(a===lo?q:-q));};
        if(depth>=2&&targetFlow>0){
            for(let y=0;y<ROWS-1;y++)for(let x=0;x<COLS-1;x++){
                const a=idx(x,y),b=a+1,c=b+COLS,d=a+COLS;
                if(![a,b,c,d].every(i=>VALID_MASK[i]))continue;
                const z=(y+1)/depth;
                const halfWidth=impactHalfWidth(y+1,depth);
                const r=(x+.5-(COLS-1)/2)/Math.max(halfWidth,1);
                if(z<=0||z>=1||Math.abs(r)>=1)continue;
                // Odd mirrored lobes: center down, outer up, closure along top/bottom.
                const radial=Number(FIXED.impactWidth)===0?Math.pow(1-r*r,2):Math.pow(impactRadialWeight(r,1),2);
                const psi=-r*radial*16*z*z*(1-z)*(1-z);
                add(a,b,psi);add(b,c,psi);add(c,d,psi);add(d,a,psi);
            }
        }
        const raw=[];const downByRow=new Float64Array(ROWS);
        for(const [key,q] of signed){if(Math.abs(q)<1e-16)continue;const a=Math.floor(key/n),b=key%n;raw.push({a,b,q});if(b-a===COLS&&q>0)downByRow[Math.floor(a/COLS)]+=q;}
        const peak=Math.max(...downByRow),factor=peak>0?targetFlow/peak:0;
        const divergence=new Float64Array(n);
        const edges=raw.map(e=>{
            const q=e.q*factor;divergence[e.a]+=q;divergence[e.b]-=q;
            const dx=posX[e.b]-posX[e.a],dz=posZ[e.b]-posZ[e.a];
            for(const i of [e.a,e.b]){vx[i]+=q*dx/(2*volume[i]);vz[i]+=q*dz/(2*volume[i]);}
            return {from:q>=0?e.a:e.b,to:q>=0?e.b:e.a,q:Math.abs(q)};
        });
        return {edges,vx,vz,flow:peak>0?targetFlow:0,maxDivergence:Math.max(...divergence.map(Math.abs))};
    }

    // Merge opposite face flows BEFORE advection. Fresh top inflow has zero solute.
    function advectWithCirculation(grids,qGrid,links,circulation,duration){
        const n=COLS*ROWS,pairs=new Map(),outlets=[];
        const add=(a,b,q)=>{if(b<0){outlets.push({from:a,to:-1,q});return;}const lo=Math.min(a,b),hi=Math.max(a,b),key=lo*n+hi;pairs.set(key,(pairs.get(key)||0)+(a===lo?q:-q));};
        for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)for(const link of links[y][x])add(idx(x,y),link.destination,qGrid[y][x]*link.fraction);
        for(const e of circulation)add(e.from,e.to,e.q);
        const edges=[...outlets];for(const [key,q] of pairs){if(Math.abs(q)<1e-18)continue;const a=Math.floor(key/n),b=key%n;edges.push({from:q>0?a:b,to:q>0?b:a,q:Math.abs(q)});}
        const outflow=new Float64Array(n);for(const e of edges)outflow[e.from]+=e.q;
        let maxCourant=0;for(let i=0;i<n;i++)if(VALID_MASK[i])maxCourant=Math.max(maxCourant,outflow[i]*duration/(liquidWaterMassPerCell*cellVolumeWeights[i]));
        const substeps=duration>0?Math.max(1,Math.ceil(maxCourant/MAX_ADVECTION_COURANT)):0,dt=duration/Math.max(1,substeps);
        const cupByClass=grids.map(()=>0);let current=grids;
        for(let step=0;step<substeps;step++){
            const next=current.map(g=>g.slice());
            for(const e of edges){const fraction=e.q*dt/(liquidWaterMassPerCell*cellVolumeWeights[e.from]);
                for(let p=0;p<grids.length;p++){const dm=current[p][e.from]*fraction;next[p][e.from]-=dm;if(e.to<0)cupByClass[p]+=dm;else next[p][e.to]+=dm;}
            }current=next;
        }
        return {grids:current,cupByClass,substeps,maxCourant};
    }

    function simulateModel(mode) {
        const wetTau=Number(FIXED.wetTau||15);
        const diffMultiplier=Number(FIXED.diffMultiplier||1);
        const khCalibration=Number(FIXED.khCalibration||1);
        const transportMode=FIXED.transportMode||'D';
        const gamma=Number(FIXED.circulationGamma||'1');
        const contactGain=Number(FIXED.contactGain||'8');
        const contactBase=Number(FIXED.contactBase||'0.5');
        const moveCirculation=transportMode==='B'||transportMode==='D';
        const filmCirculation=transportMode==='C'||transportMode==='D';
        const pools=mode==='single'?[{label:'單池',fraction:1,diffusivity:INTERNAL_DIFFUSIVITY_CM2_S}]:THREE_POOLS;
        const channels=pools.flatMap((pool,poolIndex)=>[0,1].map(sizeIndex=>({pool,poolIndex,sizeIndex})));
        const aggregateSizes=grids=>[0,1].map(size=>{
            const out=new Float64Array(COLS*ROWS);
            channels.forEach((c,j)=>{if(c.sizeIndex===size)for(let i=0;i<out.length;i++)out[i]+=grids[j][i];});return out;
        });
        const poolCup=pools.map(()=>0);
        const current_q_in = parseFloat(FIXED.pourPreset);
        const grindKey = document.getElementById('grindPreset').value;
        const psd = GAGNE_PSD[grindKey];
        const hydraulicDiameter = psd.bedD32;
        const hydraulicScale = hydraulicDiameter / REFERENCE_HYDRAULIC_DIAMETER_UM;
        doseGrams = 22;
        const geometry = getBedGeometry(doseGrams);

        activeParticleClasses = [
            {
                key: 'small', label: '細粉族群（<100 µm）',
                diameterAreaUm: psd.fine.dArea,
                diameterDiffusionUm: psd.fine.dDiff,
                fraction: psd.fineFraction, color: '#ff9800'
            },
            {
                key: 'main', label: '粗粉族群（≥100 µm）',
                diameterAreaUm: psd.coarse.dArea,
                diameterDiffusionUm: psd.coarse.dDiff,
                fraction: 1.0 - psd.fineFraction, color: '#4caf50'
            }
        ].map(particleClass => ({
            ...particleClass,
            areaSizeRatio: particleClass.diameterAreaUm / REFERENCE_AREA_DIAMETER_UM,
            diffusionSizeRatio:
                particleClass.diameterDiffusionUm / REFERENCE_DIFFUSION_DIAMETER_UM
        }));



        const pourDuration = 140;


        const ratio = TARGET_VOLUME / doseGrams;

        // --- 先依實際粉重及 PSD 分配總可溶量，再按化學比例分池 ---
        const totalSolubleMass = doseGrams * EY_MAX_FRACTION;   // g，理論上限可溶出總量
        const perCellSoluble = totalSolubleMass / VALID_CELLS;  // 平均分配到每個粉層格子
        soluteCellMaxByClass = activeParticleClasses.map(
            particleClass => perCellSoluble * particleClass.fraction
        );
        soluteMaxByClass = soluteCellMaxByClass.map(value => value * VALID_CELLS);
        soluteMaxMassTotal = soluteMaxByClass.reduce((sum, value) => sum + value, 0);

        soluteGrids = channels.map(() => new Float64Array(COLS * ROWS));
        liquidSoluteGrids = channels.map(
            () => new Float64Array(COLS * ROWS)
        );
        // 幾何初始化供分散面積計算；時間迴圈中水量改由零開始累積。
        // 等效儲水含可交換滯水，不是幾何孔隙體積的直接測量。
        liquidWaterMassPerCell =
            POROSITY * geometry.bedConeVolume * WATER_DENSITY / VALID_CELLS;
        cellVolumeWeights=new Float64Array(COLS*ROWS);
        for(let y=0;y<ROWS;y++){
            const cells=[];for(let x=0;x<COLS;x++)if(VALID_MASK[idx(x,y)])cells.push(x);
            const fraction=Math.pow(1-y/ROWS,3)-Math.pow(1-(y+1)/ROWS,3);
            for(const x of cells)cellVolumeWeights[idx(x,y)]=fraction*VALID_CELLS/cells.length;
        }
        wetAgeStepGrid = new Uint16Array(COLS * ROWS);
        for (let i = 0; i < COLS * ROWS; i++) {
            if (VALID_MASK[i]) {
                for (let classIndex = 0; classIndex < channels.length; classIndex++) {
                    const c=channels[classIndex];
                    soluteGrids[classIndex][i] = c.pool.fraction*soluteCellMaxByClass[c.sizeIndex]*cellVolumeWeights[i];
                }
            }
        }

        history = [];
        buildDispersionFaces(geometry);

        // Linear-driving-force internal approximation: k_s=15 D_eff/R_diff^2.
        // A=6 Vparticle/d32, Gint=k_s Mmax/Ceq0, Gext=A kfilm, G in cm^3/s.
        const particleModels = activeParticleClasses.map((p,j)=>({
            ...p, d_p:p.diameterAreaUm*1e-4,
            surfaceArea:6*(1-POROSITY)*geometry.bedConeVolume/VALID_CELLS*p.fraction/(p.diameterAreaUm*1e-4),
            internalRate:15*INTERNAL_DIFFUSIVITY_CM2_S/Math.pow(p.diameterDiffusionUm*1e-4/2,2)
        }));

        let accSoluteCup = 0;
        const accSoluteCupByClass = activeParticleClasses.map(() => 0);
        let accWaterBed = 0, accWaterBypass = 0;
        let h = 0.0;
        // Effective liquid storage, inferred conditionally from water+solute mass balance.
        // Not a direct porosity or retention measurement; no evaporation in this scenario.
        const storageCapacity=(374-319.9+319.9*.0143)*doseGrams/22;
        let storedWater=0,accInputWater=0;
        const pourSegments=[{a:0,b:12,m:77},{a:42,b:68,m:123},{a:105,b:140,m:174}];

        for (let timeIndex = 0; timeIndex <= Math.round(TOTAL_TIME / DT); timeIndex++) {
            const t = timeIndex * DT;
            // t 為步末；與三個注水時間窗取精確重疊，累積注水恰為 374 g。
            // t=0 只記錄初始狀態，不先偷跑一個 DT 的固液交換。
            const stepDuration = t > 0 ? DT : 0;
            const stepStart = Math.max(0, t - DT);
            const stepInput=pourSegments.reduce((sum,p)=>sum+p.m/(p.b-p.a)*Math.max(0,Math.min(t,p.b)-Math.max(stepStart,p.a)),0);
            accInputWater+=stepInput;
            const fill=Math.min(Math.max(0,storageCapacity-storedWater),stepInput);
            storedWater+=fill;
            liquidWaterMassPerCell=Math.max(storedWater,1e-8)/VALID_CELLS;
            const wettedFraction=(storedWater/storageCapacity)*(1-Math.exp(-t/wetTau));
            let isPouring=stepInput>0;
            let q_in=(stepInput-fill)/DT;
            const jetInput=stepInput/DT;

            // PSD 的 d32 先以 Kozeny-Carman 型平方律設定 Kh 的相對值；
            // 總床流與純旁通則交給 Gagné 的圓錐徑向 Darcy 積分。
            // Beta 中央擾動僅影響交換，不改變 Darcy 穿流。
            const bedHydraulicConductivity =
                khCalibration * (hydraulicScale * hydraulicScale);
            const hydraulicFlow = gagneConeDischarge(
                h, geometry, bedHydraulicConductivity
            );
            let q_bed_current = Math.max(0, hydraulicFlow.qBed);
            let q_bypass_current = Math.max(0, hydraulicFlow.qBypass);

            // 使用圓錐殼層的精確自由水體積；一個時間步不能排出超過
            // 「步初積水 + 本步注水」的水。必要時同比例縮放床流與旁通。
            const freeWaterAtStepStart = freeWaterVolume(h, geometry.bedHeight);
            const availableDrainRate = (freeWaterAtStepStart + q_in * DT) / DT;
            const potentialDrainRate = q_bed_current + q_bypass_current;
            let hydraulicDrainScale = 1.0;
            if (potentialDrainRate > availableDrainRate && potentialDrainRate > 0) {
                const drainScale = availableDrainRate / potentialDrainRate;
                hydraulicDrainScale = drainScale;
                q_bed_current *= drainScale;
                q_bypass_current *= drainScale;
            }

            const q_out_top_bed = q_bed_current;
            let stepWaterFlowBottom = 0;

            // 流速依賴的 Beta 擾動場：不重分配每層既有 Q_y，
            // 完整場速率稍後進入 Re → Sh → k_ext。正規化確保不憑空增加水量。
            const jetVelocity = isPouring ? jetInput / JET_AREA_CM2 : 0;
            const current_y_max = impactDepthRowsFromJetSpeed(
                isPouring ? jetInput : 0,
                hydraulicScale
            );
            const betaField = buildBetaRecirculationField(current_y_max);
            const meanPourSuperficialVelocity = isPouring
                ? q_in / Math.max(geometry.flowArea, 1e-12)
                : 0;
            const recirculationVelocityScale =
                BETA_RECIRCULATION_STRENGTH * meanPourSuperficialVelocity;
            let v_grid = [];
            let q_grid = [];
            // Same independent vertical Darcy stream-tubes as the discharge integral.
            // Q(z) declines as streams leave the cone wall; this is not a 2-D pressure solve.
            const rowDarcyFlows=[];
            for (let y=0;y<ROWS;y++) {
                v_grid[y]=new Float32Array(COLS);q_grid[y]=new Float64Array(COLS);
                const radius=geometry.bedRadius*(1-y/ROWS);
                const core=Math.min(radius,hydraulicFlow.coreRadius);
                const qRow=(integrateRadialDischarge(0,core,hydraulicFlow.coffeeFilterVelocity)
                    +A_OPEN*integrateRadialDischarge(core,radius,hydraulicFlow.coffeeFilterVelocity))*hydraulicDrainScale;
                rowDarcyFlows.push(qRow);
                const cells=[];for(let x=0;x<COLS;x++)if(VALID_MASK[idx(x,y)])cells.push(x);
                const area=Math.PI*radius*radius;
                for(const x of cells){q_grid[y][x]=qRow/cells.length;v_grid[y][x]=qRow/Math.max(area,1e-12);}
            }

            // 這張 map 與介面質傳使用完全相同的局部孔隙流速：
            // 垂直 Darcy 分量與 Beta 擾動速度取向量大小，再除以孔隙率。
            const circulation=buildConservativeCirculation(current_y_max,isPouring?gamma*jetInput:0,geometry);
            const envelope=new Float32Array(COLS*ROWS),contact=new Float32Array(COLS*ROWS);
            for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
                const i=idx(x,y);if(!VALID_MASK[i])continue;
                const z=y+.5,h=current_y_max,w=impactHalfWidth(z,h),r=x-(COLS-1)/2;
                const active=isPouring&&transportMode!=='A'&&transportMode!=='legacy'&&h>=2&&w>0&&z<h&&Math.abs(r)<w;
                const oldWidth=Number(FIXED.impactWidth)===0;
                const radial=active?(oldWidth?Math.pow(1-(r/w)**2,2):impactRadialWeight(r,w)):0;
                const vertical=active?Math.min(1,gamma)*Math.pow(1-(z/h)**2,2):0;
                envelope[i]=radial*vertical;
                const enhancement=oldWidth?1-Math.pow(1-envelope[i],contactGain):radial*(1-Math.pow(1-vertical,contactGain));
                contact[i]=transportMode==='legacy'?1:contactBase+(1-contactBase)*enhancement;
            }
            const flowSpeedMap = new Float32Array(COLS * ROWS);
            const transportSpeedMap=new Float32Array(COLS*ROWS);
            let maxFlowSpeed = 0;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const i = idx(x, y);
                    if (!VALID_MASK[i]) continue;
                    const localRecirculationVelocity =
                        betaField.speed[y][x] * recirculationVelocityScale;
                    const combinedSpeed=Math.hypot(circulation.vx[i],v_grid[y][x]+circulation.vz[i])/POROSITY;
                    transportSpeedMap[i]=moveCirculation?combinedSpeed:v_grid[y][x]/POROSITY;
                    const vInterstitial=transportMode==='legacy'?Math.hypot(v_grid[y][x],localRecirculationVelocity)/POROSITY
                        :filmCirculation?combinedSpeed:v_grid[y][x]/POROSITY;
                    flowSpeedMap[i] = vInterstitial;
                    maxFlowSpeed = Math.max(maxFlowSpeed, vInterstitial);
                }
            }

            const freeWaterAtStepEnd = Math.max(0,
                freeWaterAtStepStart
                + (q_in - q_out_top_bed - q_bypass_current) * DT
            );
            h = pondingHeightFromVolume(freeWaterAtStepEnd, geometry.bedHeight);

            let phase=t<42?'簡化悶蒸':isPouring?'正式注水':t<140?'段間等待':h>0.001?'滴濾中':'滴濾完成';

            // ---------- A. 固相 → 每格持久液相（隱式耗減與共同液相耦合） ----------
            // C_eq 決定傳質方向與驅動力；K_overall 決定接近平衡的速度。
            // 同時求解新固相殘量與新液相濃度；暫採單向溶出，不模擬再吸附。
            if (stepDuration > 0) {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        const i = idx(x, y);
                        if (!VALID_MASK[i]) continue;

                        const weight=cellVolumeWeights[i];
                        const W=liquidWaterMassPerCell*weight;
                        for(let pIndex=0;pIndex<pools.length;pIndex++){
                        const pool=pools[pIndex], offset=pIndex*2;
                        const L0=liquidSoluteGrids[offset][i]+liquidSoluteGrids[offset+1][i];
                        const C0=L0/W;
                        const Sc=KINEMATIC_VISCOSITY/MASS_DIFFUSIVITY;
                        const terms=particleModels.map((p,j)=>{
                            const Re=flowSpeedMap[i]*p.d_p/KINEMATIC_VISCOSITY;
                            const Sh=SH_BASE+SH_FLOW_COEFF*Math.pow(Re,SH_RE_EXPONENT)*Math.pow(Sc,SH_SC_EXPONENT);
                            const kext=EXTERNAL_TRANSFER_FACTOR*Sh*MASS_DIFFUSIVITY/p.d_p;
                            const Gext=p.surfaceArea*weight*kext;
                            const rate=15*pool.diffusivity*diffMultiplier/Math.pow(p.diameterDiffusionUm*1e-4/2,2);
                            const Gint=rate*soluteCellMaxByClass[j]*weight/C_SAT_SINGLE;
                            const G=wettedFraction*contact[i]*Gext*Gint/Math.max(Gext+Gint,1e-30);
                            const b=C_SAT_SINGLE/(soluteCellMaxByClass[j]*weight);
                            const m=soluteGrids[offset+j][i];
                            return {j:offset+j,m,b,a:stepDuration*G/(1+stepDuration*G*b)};
                        });
                        // Backward-Euler coupled finite reservoirs, one-way dissolution.
                        // dm_i=a_i max(b_i*m_i-Cnew,0), W*Cnew=L0+sum(dm_i).
                        // Active-set solve updates depletion AND liquid concentration together.
                        let active=terms.filter(p=>p.b*p.m>C0), Cnew=C0;
                        for(let n=0;n<3;n++){
                            Cnew=(L0+active.reduce((a,p)=>a+p.a*p.b*p.m,0))/(W+active.reduce((a,p)=>a+p.a,0));
                            const next=active.filter(p=>p.b*p.m>Cnew);
                            if(next.length===active.length)break;active=next;
                        }
                        for(const p of active){
                            const dm=p.a*Math.max(0,p.b*p.m-Cnew);
                            soluteGrids[p.j][i]-=dm;liquidSoluteGrids[p.j][i]+=dm;
                        }

                        } // chemical pool: each sees its own liquid concentration
                        // 接觸記錄與全域有效潤濕比例分開，無穿流時仍可固液交換。
                        if (wetAgeStepGrid[i] < 65535) wetAgeStepGrid[i]++;
                    }
                }
            }

            // ---------- B. 液相有限體積平流：舊 map → temporary map ----------
            const flowLinks = buildVerticalFlowLinks(q_grid);
            const advection = transportMode==='legacy'
                ?advectLiquidSolute(liquidSoluteGrids,q_grid,flowLinks,stepDuration)
                :advectWithCirculation(liquidSoluteGrids,q_grid,flowLinks,moveCirculation?circulation.edges:[],stepDuration);
            liquidSoluteGrids = disperseLiquidSolute(advection.grids,stepDuration);
            const stepSoluteCupByClass=[0,0];
            channels.forEach((c,j)=>{stepSoluteCupByClass[c.sizeIndex]+=advection.cupByClass[j];poolCup[c.poolIndex]+=advection.cupByClass[j];});
            const stepSoluteCup = stepSoluteCupByClass.reduce(
                (sum, mass) => sum + mass,
                0
            );

            // 水流使用同一組邊界連結；所有碰到側壁或底部的 q 都計入出杯。
            let outletFlowRate = 0;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (q_grid[y][x] <= 0) continue;
                    const outletFraction = flowLinks[y][x].reduce(
                        (sum, link) => sum + (link.destination < 0 ? link.fraction : 0),
                        0
                    );
                    outletFlowRate += q_grid[y][x] * outletFraction;
                }
            }
            stepWaterFlowBottom =
                outletFlowRate * stepDuration * WATER_DENSITY;

            accSoluteCup += stepSoluteCup;
            for (let classIndex = 0; classIndex < activeParticleClasses.length; classIndex++) {
                accSoluteCupByClass[classIndex] += stepSoluteCupByClass[classIndex];
            }
            accWaterBed += stepWaterFlowBottom;
            accWaterBypass += q_bypass_current * stepDuration;
            let totalAccumulatedWater = accWaterBed + accWaterBypass;

            // --- EY／TDS 直接用「克」做質量平衡計算，不再需要舊版的魔術數字 ---
            const totalEY = (accSoluteCup / doseGrams) * 100;

            const totalDissolvedGrams = accSoluteCup;
            // 下壺液體質量 = 流出的水 + 溶出的固形物（質量守恆，取代舊版的 *15/0.8 magic number）
            let beverageMass = totalAccumulatedWater + totalDissolvedGrams;
            let currentTDS = beverageMass > 0 ? (totalDissolvedGrams / beverageMass) * 100 : 0;
            let currentBypassRatio = totalAccumulatedWater > 0 ? (accWaterBypass / totalAccumulatedWater) * 100 : 0;

            const sizeSolid=aggregateSizes(soluteGrids),sizeLiquid=aggregateSizes(liquidSoluteGrids);
            const remainingSolidByClass = sizeSolid.map(sumGrid);
            const poolStats=pools.map((p,k)=>{
                const initial=totalSolubleMass*p.fraction;
                const solid=sumGrid(soluteGrids[2*k])+sumGrid(soluteGrids[2*k+1]);
                const liquid=sumGrid(liquidSoluteGrids[2*k])+sumGrid(liquidSoluteGrids[2*k+1]);
                return {label:p.label,initial,solid,liquid,cup:poolCup[k],releasedPercent:100*(initial-solid)/initial,cupEY:100*poolCup[k]/doseGrams,error:initial-solid-liquid-poolCup[k]};
            });
            const releasedSolidByClass = remainingSolidByClass.map(
                (remaining, classIndex) => {
                    const released =
                        soluteMaxByClass[classIndex] - remaining;
                    return Math.abs(released) < 1e-12
                        ? 0
                        : Math.max(0, released);
                }
            );
            const classRatios = releasedSolidByClass.map(
                (mass, classIndex) => (mass / soluteMaxByClass[classIndex]) * 100
            );
            const totalReleasedSolid = releasedSolidByClass.reduce(
                (sum, mass) => sum + mass,
                0
            );
            const totalRatio = (totalReleasedSolid / soluteMaxMassTotal) * 100;
            const retainedLiquidMass = liquidSoluteGrids.reduce(
                (sum, grid) => sum + sumGrid(grid),
                0
            );
            const soluteMassBalanceError =
                soluteMaxMassTotal
                - (
                    remainingSolidByClass.reduce((sum, mass) => sum + mass, 0)
                    + retainedLiquidMass
                    + accSoluteCup
                );
            const stepCupWater =
                stepWaterFlowBottom + q_bypass_current * stepDuration;
            const instantTds = stepCupWater + stepSoluteCup > 0
                ? (stepSoluteCup / (stepCupWater + stepSoluteCup)) * 100
                : 0;
            const releaseRateMgS =
                stepDuration > 0 ? (stepSoluteCup / stepDuration) * 1000 : 0;
            const flowBalanceError =
                q_bed_current * stepDuration * WATER_DENSITY
                - stepWaterFlowBottom;

            // .slice() 是原生記憶體複製，取代舊版 JSON.parse(JSON.stringify(grid))，
            // 在相同資料量下快非常多，且不會產生大量暫時性物件造成 GC 壓力。
            history.push({
                time: t, wettedFraction, storedWater, accInputWater, beverageMass, waterMassBalanceError:accInputWater-storedWater-freeWaterAtStepEnd-totalAccumulatedWater,
                soluteByClass: sizeSolid,
                solidByPool: pools.map((p,k)=>Float64Array.from(soluteGrids[2*k],(v,i)=>v+soluteGrids[2*k+1][i])),
                liquidByClass: sizeLiquid, modelMode:mode, poolStats,
                envelope,contact,contactBase,recircX:Float32Array.from(circulation.vx,v=>v/POROSITY),recircZ:Float32Array.from(circulation.vz,v=>v/POROSITY),
                flowSpeed: flowSpeedMap, transportSpeed:transportSpeedMap, transportMode,gamma,
                circulationFlow:moveCirculation?circulation.flow:0,circulationDivergence:circulation.maxDivergence,
                darcySpeed: Float32Array.from(VALID_MASK,(_,i)=>v_grid[Math.floor(i/COLS)][i%COLS]/POROSITY),
                maxFlowSpeed,
                totalEY, tds: currentTDS, instantTds, releaseRateMgS,
                totalRatio, classRatios, waterLevel: h, phase, current_y_max,
                jetVelocity,
                maxRecirculationVelocity: recirculationVelocityScale,
                bypassRatio: currentBypassRatio, bedHeight: geometry.bedHeight,
                flowArea: geometry.flowArea, qBed: q_bed_current,
                qBedCore: hydraulicFlow.qCore * hydraulicDrainScale,
                qBedSide: hydraulicFlow.qSideCoffee * hydraulicDrainScale,
                rowDarcyFlows,
                qBypass: q_bypass_current,
                filterBeta: FILTER_BETA_MDPERUM, aOpen: A_OPEN,
                accumulatedWaterBed: accWaterBed,
                accumulatedWaterBypass: accWaterBypass,
                freeWaterVolume: freeWaterAtStepEnd,
                flowBalanceError, soluteMassBalanceError,
                retainedLiquidMass,
                liquidWaterMassPerCell,
                cellVolumeWeights,
                advectionSubsteps: advection.substeps,
                maxCourant: advection.maxCourant,
                accumulatedByClass: accSoluteCupByClass.slice(),
                grindKey, hydraulicScale, bedHydraulicConductivity
            });
        }
        return history;
    }

    function initSimulation(){
        threeHistory=simulateModel('three');
        history=threeHistory;
        const completedState=history.find(state=>state.phase==='滴濾完成');
        document.getElementById('finishTimeLabel').innerText = completedState
            ? `滴濾完成：${(BLOOM_TIME + completedState.time).toFixed(1)} s`
            : `滴濾完成：${DISPLAY_END_TIME} s 內尚未完成`;
        setupChart();
        updateVisuals(0);
    }

    function getCellColor(state, x, y, mode) {
        const i = idx(x, y);
        if (!VALID_MASK[i]) return '#1e1e1e';
        if(mode==='envelope'||mode==='contact'){
            const v=mode==='envelope'?state.envelope[i]:state.contact[i];return 'rgb('+Math.round(20+230*v)+','+Math.round(45+160*v)+','+Math.round(100-60*v)+')';
        }
        if (mode === 'flow' || mode === 'darcy' || mode === 'transport') {
            const normalized = (mode==='darcy'?state.darcySpeed[i]:mode==='transport'?state.transportSpeed[i]:state.flowSpeed[i]) / FLOW_HEATMAP_MAX_CM_S;
            const ratio = Math.sqrt(Math.max(0, Math.min(1, normalized)));
            if (ratio <= 0.5) {
                const t = ratio * 2;
                const r = Math.round(8 + t * (0 - 8));
                const g = Math.round(31 + t * (188 - 31));
                const b = Math.round(54 + t * (212 - 54));
                return `rgb(${r},${g},${b})`;
            }
            const t = (ratio - 0.5) * 2;
            const r = Math.round(t * 255);
            const g = Math.round(188 + t * (235 - 188));
            const b = Math.round(212 + t * (59 - 212));
            return `rgb(${r},${g},${b})`;
        }
        if (mode === 'liquid') {
            const liquidMass = state.liquidByClass.reduce(
                (sum, grid) => sum + grid[i],
                0
            );
            const concentration =
                liquidMass / Math.max(state.liquidWaterMassPerCell*state.cellVolumeWeights[i], 1e-12);
            const ratio = Math.max(
                0,
                Math.min(1, concentration / C_SAT_SINGLE)
            );
            const r = Math.floor(20 + ratio * 235);
            const g = Math.floor(45 + ratio * 190);
            const b = Math.floor(80 + ratio * 40);
            return `rgb(${r},${g},${b})`;
        }
        let remainingMass;
        let maximumMass;
        if (/^pool[0-2]$/.test(mode)) {
            const p=Number(mode.slice(4));
            remainingMass=state.solidByPool[p][i];
            maximumMass=soluteCellMaxByClass.reduce((sum,value)=>sum+value,0)*THREE_POOLS[p].fraction;
        } else if (mode === 'small') {
            remainingMass = state.soluteByClass[0][i];
            maximumMass = soluteCellMaxByClass[0];
        } else if (mode === 'main') {
            remainingMass = state.soluteByClass[1][i];
            maximumMass = soluteCellMaxByClass[1];
        } else {
            remainingMass = state.soluteByClass.reduce((sum, grid) => sum + grid[i], 0);
            maximumMass = soluteCellMaxByClass.reduce((sum, value) => sum + value, 0);
        }
        let ratio = remainingMass / (maximumMass*state.cellVolumeWeights[i]);
        ratio = Math.max(0, Math.min(1, ratio));

        const r = Math.floor(244 + ratio * (76 - 244));
        const g = Math.floor(67 + ratio * (175 - 67));
        const bl = Math.floor(54 + ratio * (80 - 54));
        return `rgb(${r},${g},${bl})`;
    }

    function updateVisuals(stepIndex) {
        if (stepIndex >= history.length) stepIndex = history.length - 1;
        const state = history[stepIndex];
        ['fast','mid','slow'].forEach((key,p)=>{
            const value=state.poolStats[p].releasedPercent;
            document.getElementById(key+'Release').innerText=value.toFixed(1)+'%';
            document.getElementById(key+'Bar').style.width=Math.max(0,Math.min(100,value))+'%';
        });
        const mode = document.getElementById('heatmapMode').value;
        const showingLiquid = mode === 'liquid';
        const showingFlow = mode === 'flow' || mode === 'darcy' || mode === 'transport';
        const visibleMaxFlow=mode==='darcy'?Math.max(...state.darcySpeed):mode==='transport'?Math.max(...state.transportSpeed):state.maxFlowSpeed;
        document.getElementById('legendLow').innerText = showingFlow
            ? '■ 0 cm/s'
            : showingLiquid
                ? '■ 深藍色（低濃度）'
                : '■ 紅色（完全耗盡）';
        document.getElementById('legendLow').style.color = showingFlow
            ? '#081f36'
            : showingLiquid ? '#145080' : '#f44336';
        document.getElementById('legendHigh').innerText = showingFlow
            ? visibleMaxFlow > 0
                ? `■ ${FLOW_HEATMAP_MAX_CM_S.toFixed(1)} cm/s 色階上限（此刻最高 ${visibleMaxFlow.toFixed(3)} cm/s）`
                : '■ 尚無床內水流'
            : showingLiquid
                ? '■ 黃色（高濃度）'
                : '■ 綠色（尚未萃取）';
        document.getElementById('legendHigh').style.color =
            showingFlow || showingLiquid ? '#ffeb3b' : '#4caf50';

        if(mode==='envelope'||mode==='contact'){
            document.getElementById('legendLow').innerText='■ 0';document.getElementById('legendHigh').innerText='■ 1（此刻最高 '+Math.max(...(mode==='envelope'?state.envelope:state.contact)).toFixed(3)+'）';
        }

        const canvas = document.getElementById('bedCanvas');
        const ctx = canvas.getContext('2d');
        const compactBed=window.matchMedia('(max-width:600px)').matches;
        const cellW = compactBed?Math.min(canvas.width/(2*TOP_RADIUS+2),canvas.height/ROWS):canvas.width/COLS;
        const cellH = compactBed?cellW:canvas.height/ROWS;
        const bedOffsetX=compactBed?(canvas.width-COLS*cellW)/2:0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 畫布比例固定為 COLS:ROWS = 2:1，因此 cellW ≈ cellH。
        // 直接繪製模擬用 VALID_MASK；不再疊加第二套「視覺錐體」，
        // 避免兩個 mask 交集把錐角錯誤縮窄。
        for (let x = 0; x < COLS; x++) {
            for (let y = 0; y < ROWS; y++) {
                ctx.fillStyle = getCellColor(state, x, y, mode);
                ctx.fillRect(
                    bedOffsetX + x * cellW,
                    y * cellH,
                    cellW + 0.5,
                    cellH + 0.5
                );
            }
        }

        const displayTime = BLOOM_TIME + state.time;
        document.getElementById('timeLabel').innerText = displayTime.toFixed(1);
        document.getElementById('timeSlider').value = displayTime;

        document.getElementById('waterLevelLabel').innerText = state.waterLevel.toFixed(2);
        const pondScale=Math.max(1,...history.map(h=>h.waterLevel));
        const pondFraction=Math.max(0,Math.min(1,state.waterLevel/pondScale));
        const pondY=105-85*pondFraction, pondLeft=127-40*pondFraction, pondRight=473+40*pondFraction;
        document.getElementById('pondHeightLabel').innerText=state.waterLevel.toFixed(2)+' cm';
        document.getElementById('pondFill').setAttribute('d',`M127 105 L473 105 L${pondRight} ${pondY} L${pondLeft} ${pondY} Z`);
        document.getElementById('pondSurface').setAttribute('d',`M${pondLeft} ${pondY} L${pondRight} ${pondY}`);
        const stage=state.time<42?'悶蒸':state.time<68?'第一段注水':state.time<105?'段間等待':state.time<140?'第二段注水':state.phase==='滴濾完成'?'滴濾完成':'滴濾中';
        const banner=document.getElementById('stageBanner');
        banner.innerText=stage;
        banner.style.borderColor=stage==='滴濾完成'?'#65c98b':stage.includes('注水')?'#4db8ff':'#e0ae67';
        document.getElementById('phaseLabel').innerText = state.phase;

        if (state.phase === "滴濾中") document.getElementById('phaseLabel').style.color = "#ff9800";
        else if (state.phase === "滴濾完成") document.getElementById('phaseLabel').style.color = "#4caf50";
        else document.getElementById('phaseLabel').style.color = "#ffeb3b";

        document.getElementById('smallEyLabel').innerText = state.classRatios[0].toFixed(2);
        // Freeze only the summary card; retain physical history and reversible time scrubbing.
        const dripCompletedState = history.find(h => h.phase === '滴濾完成');
        const mainSummaryFrozen = dripCompletedState && state.time >= dripCompletedState.time;
        const mainSummaryState = mainSummaryFrozen ? dripCompletedState : state;
        document.getElementById('mainEyLabel').innerText = mainSummaryState.classRatios[1].toFixed(2);
        document.getElementById('mainEyCaption').innerText = mainSummaryFrozen
            ? '粗粉完成度（滴濾完成時）' : '粗粉完成度';
        document.getElementById('eyLabel').innerText = state.totalEY.toFixed(2);
        document.getElementById('tdsLabel').innerText = state.tds.toFixed(2);

        brewChart.data.labels = history.slice(0, stepIndex + 1)
            .map(h => (BLOOM_TIME + h.time).toFixed(0));
        brewChart.data.datasets[0].data = history.slice(0, stepIndex + 1).map(h => h.totalRatio);
        brewChart.data.datasets[1].data = history.slice(0, stepIndex + 1).map(h => h.classRatios[0]);
        brewChart.data.datasets[2].data = history.slice(0, stepIndex + 1).map(h => h.classRatios[1]);
        brewChart.update('none');
        poolChart.data.labels=brewChart.data.labels.slice();
        poolChart.data.datasets.forEach((ds,p)=>{ds.data=history.slice(0,stepIndex+1).map(h=>h.poolStats[p].releasedPercent);});
        poolChart.update('none');

        diagnosticChart.data.labels = history.slice(0, stepIndex + 1)
            .map(h => (BLOOM_TIME + h.time).toFixed(0));
        diagnosticChart.data.datasets[0].data = history.slice(0, stepIndex + 1).map(h => h.releaseRateMgS);
        diagnosticChart.data.datasets[1].data = history.slice(0, stepIndex + 1).map(h => h.instantTds);
        diagnosticChart.update('none');
        localizeDisplay();
    }

    let playbackFrame=0;
    function loop() {
        if (!isPlaying) return;
        playbackFrame++;
        if(playbackFrame%2===1){animationId=requestAnimationFrame(loop);return;}
        let slider = document.getElementById('timeSlider');
        let nextVal = parseFloat(slider.value) + DT;
        if (nextVal > DISPLAY_END_TIME) { isPlaying = false; return; }

        slider.value = nextVal;
        updateVisuals(Math.floor((nextVal - BLOOM_TIME) / DT));
        animationId = requestAnimationFrame(loop);
    }

    function setupChart() {
        if (brewChart) brewChart.destroy();
        if (diagnosticChart) diagnosticChart.destroy();
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        brewChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '總可溶物完成度', data: [], borderColor: '#eeeeee', borderWidth: 3, pointRadius: 0, tension: 0.1, yAxisID: 'y' },
                    { label: '細粉族群（<100 µm）', data: [], borderColor: '#ff9800', borderWidth: 2, pointRadius: 0, tension: 0.1, yAxisID: 'y' },
                    { label: '粗粉族群（≥100 µm）', data: [], borderColor: '#4caf50', borderWidth: 2, pointRadius: 0, tension: 0.1, borderDash: [6, 4], yAxisID: 'y' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: '沖煮時間 (s)', color: '#aaa' }, ticks: { maxTicksLimit: 12, color: '#aaa' }, grid: { color: '#333' } },
                    y: { type: 'linear', position: 'left', min: 0, max: 100, title: { display: true, text: '族群庫存釋放完成度 (%)', color: '#ccc', font: { size: 14 } }, ticks: { color: '#aaa' }, grid: { color: '#333' } }
                },
                animation: false,
                plugins: { legend: { position: 'top', labels: { color: '#eee', font: { size: 14 } } } }
            }
        });

        if(poolChart)poolChart.destroy();
        poolChart=new Chart(document.getElementById('poolCanvas').getContext('2d'),{
            type:'line',
            data:{labels:[],datasets:['快池','中池','慢池'].map((label,p)=>({label,data:[],borderColor:['#ff9800','#4db8ff','#b388ff'][p],borderWidth:2,pointRadius:0,tension:0.1}))},
            options:{responsive:true,maintainAspectRatio:false,animation:false,
                scales:{x:{title:{display:true,text:'沖煮時間 (s)',color:'#aaa'},ticks:{maxTicksLimit:12,color:'#aaa'},grid:{color:'#333'}},y:{min:0,max:100,title:{display:true,text:'各池庫存釋放完成度 (%)',color:'#ccc'},ticks:{color:'#aaa'},grid:{color:'#333'}}},
                plugins:{legend:{labels:{color:'#eee'}}}}
        });
        const diagnosticCtx = document.getElementById('diagnosticCanvas').getContext('2d');
        diagnosticChart = new Chart(diagnosticCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '下壺溶質速率 (mg/s)', data: [], borderColor: '#ffeb3b', borderWidth: 2, pointRadius: 0, tension: 0.08, yAxisID: 'rate' },
                    { label: '瞬時出口 TDS (%)', data: [], borderColor: '#4db8ff', borderWidth: 2, pointRadius: 0, tension: 0.08, yAxisID: 'tds' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: '沖煮時間 (s)', color: '#aaa' }, ticks: { maxTicksLimit: 12, color: '#aaa' }, grid: { color: '#333' } },
                    rate: { type: 'linear', position: 'left', min: 0, title: { display: true, text: 'mg/s', color: '#ffeb3b' }, ticks: { color: '#aaa' }, grid: { color: '#333' } },
                    tds: { type: 'linear', position: 'right', min: 0, title: { display: true, text: '瞬時 TDS (%)', color: '#4db8ff' }, ticks: { color: '#aaa' }, grid: { drawOnChartArea: false } }
                },
                animation: false,
                plugins: { legend: { position: 'top', labels: { color: '#eee', font: { size: 13 } } } }
            }
        });
    }

    function resizeCanvas() {
        const c1 = document.getElementById('bedCanvas');
        document.querySelector('.pond-view svg').setAttribute('viewBox',window.matchMedia('(max-width:600px)').matches?'110 0 380 110':'0 0 600 110');
        const dpr = window.devicePixelRatio || 1;

        const cssWidth = c1.clientWidth;
        const cssHeight = c1.clientHeight;

        c1.width = Math.round(cssWidth * dpr);
        c1.height = Math.round(cssHeight * dpr);

        // 初次載入時 history 尚未建立，避免在 initSimulation 前讀取空狀態。
        if (!history.length) return;

        updateVisuals(
            Math.floor(
                (parseFloat(document.getElementById('timeSlider').value) - BLOOM_TIME) / DT
            )
        );
    }

    window.addEventListener('resize', resizeCanvas);

    document.getElementById('playBtn').addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) loop();
        else cancelAnimationFrame(animationId);
    });

    document.getElementById('timeSlider').addEventListener('input', (e) => {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        updateVisuals(
            Math.floor((parseFloat(e.target.value) - BLOOM_TIME) / DT)
        );
    });

    document.getElementById('heatmapMode').addEventListener('change', () => {
        updateVisuals(Math.floor(
            (parseFloat(document.getElementById('timeSlider').value) - BLOOM_TIME) / DT
        ));
    });


    document.getElementById('grindPreset').addEventListener('change', () => {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        document.getElementById('timeSlider').value = BLOOM_TIME;
        initSimulation();
    });

    document.getElementById('languageSelect').addEventListener('change',event=>{
        uiLanguage=event.target.value;
        localizeDisplay();
    });
    // Translate before simulation/chart initialization, even on offline devices.
    localizeDisplay();
    setTimeout(() => {
        initSimulation();
        resizeCanvas();
    }, 100);
</script>


</body>
</html>

  bounds.forEach((b,k)=>{const q=f.bf[k];if(b.top){bottom[cells[b.i].x]+=q;if(full)links.push({i:n+(NF-1)*NR+cells[b.i].x,j:b.i,q,d:0,interface:true,area:b.A});}else{if(q>1e-14)throw Error('濾紙出口發生外界倒灌，超出本版邊界假設');outlets.push({i:b.i,q:Math.max(0,-q)});}});
  let ff=null;
  if(full){
   ff=freeFlux(net,pond,qin,bottom,f.plume.hp,net.o.height/100>net.pondH(pond)?RECIRCULATION:0,FREE_MIX,f.loop);
   links.forEach(e=>{if(e.interface)e.d=e.area/(net.dz/2/f.bedD[e.j]+ff.h/(2*NF)/(DIFF+ff.D));});
   ff.links.forEach(e=>links.push({i:n+e.i,j:n+e.j,q:e.q,d:e.d}));
   maxFreeResidual=Math.max(maxFreeResidual,ff.residual);
   maxInterfaceError=Math.max(maxInterfaceError,Math.abs(sum(bottom)-f.input*duty));
  }
  lastFree=ff?{psi:ff.psi.map(a=>Array.from(a)),top:ff.top,bottom:Array.from(bottom),target:ff.target,D:ff.D,h:ff.h,hp:ff.hp}:null;
  const loss=new Float64Array(n+nf);links.forEach(e=>{loss[e.q>=0?e.i:e.j]+=Math.abs(e.q);loss[e.i]+=e.d;loss[e.j]+=e.d;});outlets.forEach(b=>loss[b.i]+=b.q);
  if(!full)bounds.forEach((b,k)=>{if(b.top&&f.bf[k]<0)loss[b.i]-=f.bf[k];});
  const pondEnd=full?pond+(qin-sum(bottom))*dt:Math.max(0,pond-sum(bottom)*dt),minP=full?Math.min(pond,pondEnd):pond;
  let limit=dt;loss.forEach((q,i)=>{if(q>0)limit=Math.min(limit,.25*(i<n?wv[i]:minP*fw[i-n])/q);});
  if(!full){const pout=sum(Array.from(bottom).map(q=>Math.max(0,q)));if(pout>0&&pond>0)limit=Math.min(limit,.25*pond/pout);}
  const steps=Math.max(1,Math.ceil(dt/Math.max(limit,1e-8))),ds=dt/steps;stepsTotal+=steps;
  for(let step=0;step<steps;step++){
   const dv=mass.map(()=>[0,0,0]),vol=wv.concat(fw.map(w=>Math.max(pond*w,1e-30)));
   const transfers=links.map(e=>({i:e.i,j:e.j,dm:[0,1,2].map(j=>{const ci=mass[e.i][j]/vol[e.i],cj=mass[e.j][j]/vol[e.j];return (e.q*(e.q>=0?ci:cj)+e.d*(ci-cj))*ds;})}));
   const sinks=outlets.map(b=>({i:b.i,dm:[0,1,2].map(j=>b.q*ds*mass[b.i][j]/wv[b.i])})),outgoing=mass.map(()=>[0,0,0]);
   transfers.forEach(t=>t.dm.forEach((dm,j)=>outgoing[dm>=0?t.i:t.j][j]+=Math.abs(dm)));sinks.forEach(t=>t.dm.forEach((dm,j)=>outgoing[t.i][j]+=dm));
   const limiter=mass.map((a,i)=>a.map((m,j)=>outgoing[i][j]>0?Math.min(1,m/outgoing[i][j]):1));
   transfers.forEach(t=>t.dm.forEach((dm,j)=>{const donor=dm>=0?t.i:t.j,limited=dm*limiter[donor][j];dv[t.i][j]-=limited;dv[t.j][j]+=limited;}));
   sinks.forEach(t=>t.dm.forEach((dm,j)=>{const limited=dm*limiter[t.i][j];dv[t.i][j]-=limited;cupM[j]+=limited;}));outlets.forEach(b=>cup+=b.q*ds);
   if(full){pond+=(qin-sum(bottom))*ds;input+=qin*ds;}
   else{
    const pm=[0,1,2].map(j=>sum(mass.slice(n).map(a=>a[j]))),change=[0,0,0],requests=[];
    bounds.forEach((b,k)=>{if(!b.top)return;const q=f.bf[k];requests.push({i:b.i,q,dm:[0,1,2].map(j=>q*ds*(q>=0?(pond>1e-20?pm[j]/pond:0):mass[b.i][j]/wv[b.i]))});});
    const pondOut=[0,1,2].map(j=>sum(requests.map(t=>Math.max(0,t.dm[j])))),pondLimit=pondOut.map((v,j)=>v>0?Math.min(1,pm[j]/v):1);
    requests.forEach(t=>t.dm.forEach((dm,j)=>{let limited;if(dm>=0)limited=dm*pondLimit[j];else limited=-Math.min(-dm,Math.max(0,mass[t.i][j]+dv[t.i][j]));dv[t.i][j]+=limited;change[j]-=limited;}));
    fw.forEach((w,i)=>{for(let j=0;j<3;j++)dv[n+i][j]+=change[j]*w;});pond-=sum(bottom)*ds;
   }
   mass.forEach((a,i)=>{for(let j=0;j<3;j++){a[j]+=dv[i][j];minMass=Math.min(minMass,a[j]);if(a[j]<-1e-18)throw Error('溶質輸送產生負質量');if(a[j]<0){roundoffAdded-=a[j];a[j]=0;}}});
   cells.forEach((c,i)=>{
    const A=2.5*6*mc[i]/(1100*dp),Re=RHO*f.speed[i]/EPS*dp/MU,Sc=MU/(RHO*DIFF),km=(2+1.1*Re**.6*Sc**(1/3))*DIFF/dp;
    for(let j=0;j<3;j++){const G=1/(dp/6/(DE[j]*A)+1/(km*A)),a=CS[j]/initial[i][j],drive=a*solid[i][j]-mass[i][j]/wv[i],dm=drive>0?Math.min(solid[i][j],drive/(a+1/wv[i])*(-Math.expm1(-G*(a+1/wv[i])*ds))):0;solid[i][j]-=dm;mass[i][j]+=dm;rates[j]+=dm/.5;minMass=Math.min(minMass,solid[i][j]);}
   });
  }
  if(pond<0&&pond>-1e-16)pond=0;
  time+=dt;if(time>=nextSave-1e-9){save();nextSave+=.5;}
 }
 return {history,maxResidual,maxFreeResidual,maxInterfaceError,maxWaterError:maxWaterError*RHO*1000,maxSoluteError:maxSoluteError*1000,minMass,stepsTotal,maxLoopPowerRatio,roundoffAdded};
}
let model,result,playing=false,timer;
const $=id=>document.getElementById(id);
function options(){const o={dose:20};for(const id of ['pour','grind','height']){const el=$(id);if(!Number.isFinite(+el.value))throw Error('請選擇 '+id);o[id]=+el.value;}return {...o,diameter:4,eta:IMPACT_EFFICIENCY,recirc:RECIRCULATION,mix:FREE_MIX,block:BLOCK_FACTOR,bedmix:BED_DISPERSIVITY};}
function plot(){
 const cv=$('chart'),c=cv.getContext('2d'),a=result.history,idx=+$('time').value,s=a[idx],W=cv.width,H=cv.height,L=52,R=18,T=28,B=42,pw=W-L-R,ph=H-T-B,maxT=a[a.length-1].t,colors=['#ffa766','#58d7d1','#c8a0ed'];
 c.clearRect(0,0,W,H);c.font='13px system-ui';c.fillStyle='#bbccd8';c.fillText('析出比例 (%)',8,18);
 for(let k=0;k<=4;k++){const y=T+ph*(1-k/4);c.fillText(String(k*25),18,y+4);c.strokeStyle='#344754';c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();}
 for(let k=0;k<=5;k++){const x=L+pw*k/5;c.fillText(String(Math.round(maxT*k/5)),x-8,H-13);}c.fillText('s',W-12,H-13);
 const draw=(j,end,alpha,width)=>{c.globalAlpha=alpha;c.strokeStyle=colors[j];c.lineWidth=width;c.beginPath();for(let k=0;k<=end;k++){const x=L+a[k].t/maxT*pw,y=T+(1-Math.max(0,Math.min(100,a[k].poolExtracted[j]))/100)*ph;k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();};
 colors.forEach((_,j)=>{draw(j,idx,1,3);const x=L+s.t/maxT*pw,y=T+(1-s.poolExtracted[j]/100)*ph;c.fillStyle=colors[j];c.beginPath();c.arc(x,y,4,0,2*PI);c.fill();});c.globalAlpha=1;c.lineWidth=1;
 const eventLine=(t,color,dash)=>{if(s.t<t)return;const x=L+t/maxT*pw;c.strokeStyle=color;c.lineWidth=2;c.setLineDash(dash);c.beginPath();c.moveTo(x,T);c.lineTo(x,T+ph);c.stroke();c.setLineDash([]);};
 eventLine(result.pourEnd,'#7dd3fc',[8,4]);eventLine(result.dripEnd,'#f2d184',[2,4]);
 const x=L+s.t/maxT*pw;c.strokeStyle='#e6edf3';c.setLineDash([4,4]);c.beginPath();c.moveTo(x,T);c.lineTo(x,T+ph);c.stroke();c.setLineDash([]);
 $('poolValues').innerHTML=`<span class="fast">快溶池 ${s.poolExtracted[0].toFixed(1)}%</span><span class="mid">中溶池 ${s.poolExtracted[1].toFixed(1)}%</span><span class="slow">慢溶池 ${s.poolExtracted[2].toFixed(1)}%</span>${s.t>=result.pourEnd?`<span style="color:#7dd3fc">│ 注水結束 ${result.pourEnd.toFixed(1)} s</span>`:''}${s.t>=result.dripEnd?`<span style="color:#f2d184">│ 滴濾結束 ${result.dripEnd.toFixed(1)} s</span>`:''}`;
}
function render(){if(!result)return;const s=result.history[+$('time').value],cv=$('bed'),c=cv.getContext('2d'),mode=$('mode').value,W=cv.width,H=cv.height,scale=Math.min((W-70)/(2*model.R),(H-70)/model.H),cx=W/2,y0=25;
 const val=d=>mode==='agitation'?d.agitation:mode==='speed'?d.speed*1000:d.pools[['acid','sweet','bitter'].indexOf(mode)]*100;
 const max=mode==='agitation'?1:mode==='speed'?result.speedMax:100;
 c.clearRect(0,0,W,H);model.cells.forEach((cell,i)=>{const d=s.data[i],v=Math.max(0,Math.min(1,val(d)/max));c.fillStyle=`hsl(${220-210*v} 65% ${30+25*v}%)`;for(const sign of [-1,1]){const x=cx+(sign>0?cell.x:-(cell.x+1))*model.dr*scale,y=y0+cell.y*model.dz*scale;c.fillRect(x,y,model.dr*scale+.2,model.dz*scale+.2);if(cell.x%3===0&&cell.y%3===0&&d.speed>1e-12){const xx=x+model.dr*scale/2,yy=y+model.dz*scale/2,dx=sign*d.ur/d.speed*9,dy=d.uz/d.speed*9;c.strokeStyle='#fff';c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+dx,yy+dy);c.lineTo(xx+dx-.4*dx+.3*dy,yy+dy-.4*dy-.3*dx);c.moveTo(xx+dx,yy+dy);c.lineTo(xx+dx-.4*dx-.3*dy,yy+dy-.4*dy+.3*dx);c.stroke();}}});
 c.fillStyle='#bbccd8';c.font='13px system-ui';c.fillText(`寬 ${(2*model.R*1000).toFixed(1)} mm · 高 ${(model.H*1000).toFixed(1)} mm`,25,H-15);
 $('timeLabel').textContent=s.t.toFixed(1)+' s';$('scale').textContent=`色階：藍 0 → 紅 ${max.toFixed(2)} ${mode==='speed'?'mm/s':mode==='agitation'?'（無因次）':'%'}；白箭頭為實際水流方向。`;
 cv.onmousemove=e=>{const box=cv.getBoundingClientRect(),x=(e.clientX-box.left)*W/box.width,y=(e.clientY-box.top)*H/box.height,ix=Math.floor(Math.abs(x-cx)/(model.dr*scale)),iy=Math.floor((y-y0)/(model.dz*scale)),i=model.cells.findIndex(v=>v.x===ix&&v.y===iy);if(i>=0){const d=s.data[i];$('cell').textContent=`r ${(model.cells[i].r*1000).toFixed(1)} mm：水流 ${(d.speed*1000).toFixed(3)} mm/s、受擾 ${d.agitation.toFixed(3)}、快／中／慢溶池 ${(d.pools[0]*100).toFixed(1)}%／${(d.pools[1]*100).toFixed(1)}%／${(d.pools[2]*100).toFixed(1)}%`;}};
 plot();
}
function run(){playing=false;$('status').textContent='計算中…';setTimeout(()=>{try{model=network(options());result=simulate(model);result.speedMax=Math.max(.01,...result.history.map(s=>Math.max(...s.data.map(d=>d.speed*1000))));result.pourEnd=240/model.o.pour;const drip=result.history.find(s=>s.t>=result.pourEnd&&s.h*1000<.01&&s.q<.01);result.dripEnd=drip?drip.t:result.history.at(-1).t;$('time').max=result.history.length-1;$('time').value=Math.min(60,result.history.length-1);$('status').textContent='';render();}catch(e){$('status').textContent='計算失敗：'+e.message;}},20);}

function drawFree(){
 const s=result.history[+$('time').value],c=$('free').getContext('2d'),W=1000,H=300,left=45,top=25,pw=910,ph=210;
 c.clearRect(0,0,W,H);c.font='14px system-ui';c.fillStyle='#bcd0de';
 if(s.h<THIN_LAYER_HEIGHT||!s.freeFlux){c.fillText('目前為供水受限薄膜支路，未解析自由水層。',40,100);$('freeLabel').textContent='粉床中的循環仍可在預浸潤液體內運作；本圖只顯示可解析水層。';return;}
 for(let y=0;y<NF;y++)for(let x=0;x<NR;x++)for(const sign of [-1,1]){
  const px=left+pw/2+(sign>0?x:-(x+1))*pw/(2*NR),py=top+y*ph/NF;
  c.fillStyle=`hsl(${220-210*Math.min(1,s.freeData[y*NR+x]/3)} 65% 45%)`;c.fillRect(px,py,pw/(2*NR)+.2,ph/NF+.2);
  const p=s.freeFlux.psi,down=(p[y][x+1]-p[y][x]+p[y+1][x+1]-p[y+1][x])/2/(PI*((x+1)**2-x*x)*model.dr**2);
  const radial=-(p[y+1][x+1]-p[y][x+1]+p[y+1][x]-p[y][x])/2/(2*PI*(x+.5)*model.dr*s.freeFlux.h/NF);
  // Draw the direction after converting physical velocities to the exaggerated plot scale.
  const dx=sign*radial*pw/(2*model.R),dy=down*ph/s.freeFlux.h,norm=Math.hypot(dx,dy);
  if(x%2===0&&norm>1e-12){const xx=px+pw/(4*NR),yy=py+ph/(2*NF),a=dx/norm*12,b=dy/norm*12;c.strokeStyle='#fff';c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+a,yy+b);c.lineTo(xx+a-.4*a+.3*b,yy+b-.4*b-.3*a);c.moveTo(xx+a,yy+b);c.lineTo(xx+a-.4*a-.3*b,yy+b-.4*b+.3*a);c.stroke();}
 }
 c.fillStyle='#bcd0de';c.fillText('中央注水 ↓（循環跨越粉床界面；淨入床量不等於中央向下總量）',45,18);
 c.fillText(`粉床界面：自由水流出 = 粉床流入；水深 ${(s.h*1000).toFixed(2)} mm，垂直比例放大`,45,265);
 $('freeLabel').textContent=`顏色：液相 0–3%。鐘形循環跨入粉床 ${(model.depth*1000).toFixed(1)} mm，粉面最大半寬 ${(model.width*1000).toFixed(1)} mm；白箭頭僅顯示循環分量。Dmix=${s.freeFlux.D.toExponential(2)} m²/s。`;
}

function drawHydro(){
 if(!result)return;const c=$('hydro').getContext('2d'),W=1000,H=300;c.clearRect(0,0,W,H);c.font='14px system-ui';
 const a=result.history,mh=Math.max(1,...a.map(s=>s.h*1000)),mq=Math.max(model.o.pour,...a.map(s=>s.q)),xs=t=>55+t/300*900;
 for(const [key,color,max,y0,label] of [['h','#58d7d1',mh,125,'h (mm)'],['q','#ffa766',mq,260,'Q (g/s)']]){
  c.fillStyle=color;c.fillText(label,70,y0-96);for(let k=0;k<=2;k++){c.fillText((max*k/2).toFixed(1),10,y0-90*k/2+4);c.strokeStyle='#344754';c.beginPath();c.moveTo(55,y0-90*k/2);c.lineTo(955,y0-90*k/2);c.stroke();}
  c.strokeStyle=color;c.beginPath();a.forEach((s,i)=>{const v=key==='h'?s.h*1000:s.q,x=xs(s.t),y=y0-v/max*90;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
 }
 for(let k=0;k<=5;k++)c.fillText(String(k*60),xs(k*60)-8,285);
 c.fillStyle='#bcd0de';c.fillText('time (s)',900,20);
 const s=a[+$('time').value];$('hydroLabel').textContent=`目前水位變化 ${s.hRate.toFixed(3)} mm/s；入床淨量 ${s.q.toFixed(2)} g/s；外圍向上界面流 ${s.returnFlow.toFixed(2)} g/s。迴流不直接增加積水，K 的變化會影響淨入床量。`;
}

if(typeof document!=='undefined'){$('run').onclick=run;$('time').oninput=render;$('mode').onchange=render;$('play').onclick=()=>playing=!playing;timer=setInterval(()=>{if(playing&&result){$('time').value=(+$('time').value+1)%result.history.length;render();}},60);run();}
